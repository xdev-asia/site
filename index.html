<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Set the theme before first paint so light-scheme users get no dark flash.
      document.documentElement.setAttribute(
        "data-theme",
        window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark",
      );
    </script>
    <title>xDev</title>
    <meta name="description" content="xDev builds a workspace for AI coding agents and the developer tools around it." />
    <link rel="icon" href="/assets/brand/xdev-mark-tile.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="xdev.asia" />
    <meta property="og:image" content="https://xdev.asia/assets/duy/og.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="538" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
