<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Set the theme before first paint so light-scheme users get no dark flash.
      document.documentElement.setAttribute(
        "data-theme",
        window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark",
      );
    </script>
    <title>xDev</title>
    <meta name="description" content="xDev builds a workspace for AI coding agents and the developer tools around it." />
    <link rel="icon" href="/assets/mark.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
